basePath: /
definitions:
  github_com_xavie_gastos-api_internal_dto.AuthResponse:
    properties:
      access_token:
        type: string
      expires_in:
        example: 900
        type: integer
      refresh_token:
        type: string
      token_type:
        example: Bearer
        type: string
      user:
        $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.UserResponse'
    type: object
  github_com_xavie_gastos-api_internal_dto.AuthResponseDoc:
