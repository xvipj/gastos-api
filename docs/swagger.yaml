  github_com_xavie_gastos-api_internal_dto.UserResponse:
    properties:
      created_at:
        type: string
      email:
        example: ana@example.com
        type: string
      id:
        example: 1
        type: integer
      name:
        example: Ana García
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: Proyecto Gastos API
    url: https://github.com/xavie/gastos-api
  description: 'API REST para la gestión de gastos personales: autenticación con JWT
    y refresh tokens, categorías, transacciones, presupuestos, reportes, caché Redis
    y exportación CSV. Los importes se expresan en centavos.'
  title: Gastos API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Valida email y contraseña y devuelve un par de tokens.
      parameters:
      - description: Credenciales
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.AuthResponseDoc'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorResponse'
      summary: Iniciar sesión
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Revoca el refresh token indicado. La operación es idempotente.
      parameters:
      - description: Refresh token a revocar
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.MessageResponseDoc'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorResponse'
      summary: Cerrar sesión
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: 'Rota el refresh token: lo revoca y devuelve un par nuevo. Reutilizar
        un token revocado responde 401.'
      parameters:
      - description: Refresh token vigente
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.AuthResponseDoc'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorResponse'
      summary: Renovar tokens
      tags:
      - Auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Crea una cuenta y devuelve un par de tokens (access + refresh).
      parameters:
      - description: Datos de registro
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.AuthResponseDoc'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorResponse'
      summary: Registrar usuario
      tags:
      - Auth
  /api/v1/budgets:
    get:
      description: Devuelve los presupuestos con spent, remaining, percentage_used
        y status.
      parameters:
      - description: Mes (1-12)
        in: query
        name: month
        type: integer
      - description: Año (2000-2100)
        in: query
        name: year
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.BudgetsResponseDoc'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar presupuestos
      tags:
      - Presupuestos
    post:
      consumes:
      - application/json
      description: Crea un límite mensual para una categoría de gasto.
      parameters:
      - description: Datos del presupuesto
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.BudgetRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.BudgetResponseDoc'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Crear presupuesto
      tags:
      - Presupuestos
  /api/v1/budgets/{id}:
    delete:
      description: Elimina un presupuesto del usuario autenticado.
      parameters:
      - description: ID del presupuesto
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.MessageResponseDoc'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Eliminar presupuesto
      tags:
      - Presupuestos
    put:
      consumes:
      - application/json
      description: Modifica un presupuesto existente del usuario.
      parameters:
      - description: ID del presupuesto
        in: path
        name: id
        required: true
        type: integer
      - description: Datos actualizados
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.BudgetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.BudgetResponseDoc'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Actualizar presupuesto
      tags:
      - Presupuestos
  /api/v1/categories:
    get:
      description: Devuelve las categorías del usuario autenticado.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.CategoriesResponseDoc'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar categorías
      tags:
      - Categorías
    post:
      consumes:
      - application/json
      description: Crea una categoría de tipo income o expense para el usuario autenticado.
      parameters:
      - description: Datos de la categoría
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.CategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.CategoryResponseDoc'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Crear categoría
      tags:
      - Categorías
  /api/v1/categories/{id}:
    delete:
      description: Elimina una categoría. Responde 409 si tiene transacciones asociadas.
      parameters:
      - description: ID de la categoría
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.MessageResponseDoc'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Eliminar categoría
      tags:
      - Categorías
    put:
      consumes:
      - application/json
      description: Modifica el nombre o el tipo de una categoría del usuario.
      parameters:
      - description: ID de la categoría
        in: path
        name: id
        required: true
        type: integer
      - description: Datos actualizados
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.CategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.CategoryResponseDoc'
        "400":
