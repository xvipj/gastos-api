        example: 11
        type: integer
      total_expense:
        example: 1250500
        type: integer
      total_income:
        example: 2500000
        type: integer
      year:
        example: 2026
        type: integer
    type: object
  github_com_xavie_gastos-api_internal_dto.SummaryResponseDoc:
    properties:
      data:
        $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.SummaryResponse'
    type: object
  github_com_xavie_gastos-api_internal_dto.TransactionRequest:
    properties:
      amount:
        example: 125050
        type: integer
      category_id:
        example: 3
        type: integer
      date:
        example: "2026-11-08"
        type: string
      description:
        example: Compra semanal
        maxLength: 255
        type: string
      type:
        enum:
        - income
        - expense
        example: expense
        type: string
    required:
    - amount
    - category_id
    - date
    - type
    type: object
  github_com_xavie_gastos-api_internal_dto.TransactionResponse:
    properties:
      amount:
        example: 125050
        type: integer
      category_id:
        example: 3
        type: integer
      category_name:
        example: Alimentación
        type: string
      created_at:
        type: string
      date:
        example: "2026-11-08"
        type: string
      description:
        example: Compra semanal
        type: string
      id:
        example: 10
        type: integer
      type:
        example: expense
        type: string
      updated_at:
        type: string
    type: object
  github_com_xavie_gastos-api_internal_dto.TransactionResponseDoc:
    properties:
      data:
