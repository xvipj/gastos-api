  github_com_xavie_gastos-api_internal_dto.TransactionsResponseDoc:
    properties:
      data:
        items:
          $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.TransactionResponse'
        type: array
      meta:
        $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.Meta'
    type: object
  github_com_xavie_gastos-api_internal_dto.TrendPoint:
    properties:
      balance:
        example: 1249500
        type: integer
      expense:
        example: 1250500
        type: integer
      income:
        example: 2500000
        type: integer
      month:
        example: 2026-11
        type: string
    type: object
  github_com_xavie_gastos-api_internal_dto.TrendResponse:
    properties:
      months:
        example: 6
        type: integer
      trend:
        items:
          $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.TrendPoint'
