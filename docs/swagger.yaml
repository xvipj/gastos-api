    - name
    - password
    type: object
  github_com_xavie_gastos-api_internal_dto.SummaryResponse:
    properties:
      balance:
        example: 1249500
        type: integer
      by_category:
        items:
          $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.CategoryExpense'
