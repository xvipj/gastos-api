  github_com_xavie_gastos-api_internal_dto.LoginRequest:
    properties:
      email:
        example: ana@example.com
        type: string
      password:
        example: super-secret-123
        type: string
    required:
    - email
    - password
    type: object
  github_com_xavie_gastos-api_internal_dto.LogoutRequest:
    properties:
      refresh_token:
        example: a1b2c3...
        type: string
    required:
    - refresh_token
    type: object
  github_com_xavie_gastos-api_internal_dto.MessageResponse:
    properties:
      message:
        example: operación realizada correctamente
        type: string
    type: object
  github_com_xavie_gastos-api_internal_dto.MessageResponseDoc:
    properties:
      data:
        $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.MessageResponse'
    type: object
  github_com_xavie_gastos-api_internal_dto.Meta:
