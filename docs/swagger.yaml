        type: array
    type: object
  github_com_xavie_gastos-api_internal_dto.CategoriesResponseDoc:
    properties:
      data:
        items:
          $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.CategoryResponse'
        type: array
    type: object
  github_com_xavie_gastos-api_internal_dto.CategoryExpense:
    properties:
      amount:
        example: 125050
        type: integer
      category_id:
        example: 3
        type: integer
      category_name:
        example: Alimentación
        type: string
      percentage:
        example: 42.35
        type: number
    type: object
  github_com_xavie_gastos-api_internal_dto.CategoryRequest:
    properties:
      name:
        example: Alimentación
        maxLength: 100
        minLength: 2
        type: string
      type:
        enum:
        - income
        - expense
        example: expense
        type: string
    required:
    - name
    - type
    type: object
  github_com_xavie_gastos-api_internal_dto.CategoryResponse:
    properties:
      created_at:
        type: string
      id:
        example: 1
        type: integer
      name:
        example: Alimentación
        type: string
      type:
        example: expense
        type: string
    type: object
  github_com_xavie_gastos-api_internal_dto.CategoryResponseDoc:
    properties:
      data:
        $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.CategoryResponse'
    type: object
  github_com_xavie_gastos-api_internal_dto.ErrorDetail:
    properties:
      code:
        example: VALIDATION_ERROR
        type: string
      message:
        example: el campo email es obligatorio
        type: string
    type: object
  github_com_xavie_gastos-api_internal_dto.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.ErrorDetail'
    type: object
  github_com_xavie_gastos-api_internal_dto.HealthResponse:
    properties:
      checks:
        additionalProperties:
          type: string
        type: object
      status:
        example: ok
        type: string
    type: object
  github_com_xavie_gastos-api_internal_dto.HealthResponseDoc:
    properties:
      data:
        $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.HealthResponse'
