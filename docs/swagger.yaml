    type: object
  github_com_xavie_gastos-api_internal_dto.BudgetRequest:
    properties:
      category_id:
        example: 3
        type: integer
      limit_amount:
        example: 500000
        type: integer
      month:
        example: 11
        maximum: 12
        minimum: 1
        type: integer
      year:
        example: 2026
        maximum: 2100
        minimum: 2000
        type: integer
    required:
    - category_id
    - limit_amount
    - month
    - year
    type: object
  github_com_xavie_gastos-api_internal_dto.BudgetResponse:
    properties:
      category_id:
        example: 3
        type: integer
      category_name:
        example: Alimentación
        type: string
      created_at:
        type: string
      id:
        example: 1
        type: integer
      limit_amount:
        example: 500000
        type: integer
      month:
        example: 11
        type: integer
      percentage_used:
        example: 85
        type: number
      remaining:
        example: 75000
        type: integer
      spent:
        example: 425000
        type: integer
      status:
        example: warning
        type: string
      year:
        example: 2026
        type: integer
    type: object
  github_com_xavie_gastos-api_internal_dto.BudgetResponseDoc:
    properties:
      data:
        $ref: '#/definitions/github_com_xavie_gastos-api_internal_dto.BudgetResponse'
    type: object
  github_com_xavie_gastos-api_internal_dto.BudgetsResponseDoc:
    properties:
      data:
        items:
